# ── Production overrides ─────────────────────────────────────────────────────

# Thymeleaf — cache templates in production
spring.thymeleaf.cache=true

# JPA — let Hibernate create/update tables automatically
spring.jpa.hibernate.ddl-auto=update

# Tomcat — restore sensible limits (removed in dev for convenience)
server.tomcat.max-part-count=50
server.tomcat.max-parameter-count=500
