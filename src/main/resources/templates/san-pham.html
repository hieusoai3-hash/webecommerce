<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - NB2 Boxer Men'">Tất Cả Sản Phẩm - NB2 Boxer Men</title>
    <meta name="description" th:content="${pageDesc}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: top}"></div>

<!-- Page Hero -->
<section class="page-hero">
    <div class="page-hero-content">
        <div class="container">
            <div class="breadcrumb">
                <a th:href="@{/}">Trang chủ</a> <span>&#8250;</span> <span style="color:#fff;" th:text="${pageTitle ?: 'Tất cả sản phẩm'}">Tất cả sản phẩm</span>
            </div>
            <h1 th:text="${pageTitle ?: 'Tất Cả Sản Phẩm'}">Tất Cả Sản Phẩm</h1>
            <p th:text="${pageDesc ?: 'Khám phá bộ sưu tập quần lót nam, ví da &amp; phụ kiện cao cấp từ NB2 Boxer Men'}">Khám phá bộ sưu tập quần lót nam, ví da &amp; phụ kiện cao cấp từ NB2 Boxer Men</p>
            <div class="category-nav">
                <button class="category-pill active" data-filter="all">Tất cả</button>
                <button class="category-pill" data-filter="quan-sip">Quần sịp</button>
                <button class="category-pill" data-filter="vi-da">Ví da</button>
                <button class="category-pill" data-filter="that-lung">Thắt lưng</button>
            </div>
        </div>
    </div>
</section>

<!-- Products Section -->
<section class="products" id="products" style="padding-top: 50px;">
    <div class="container">
        <div class="products-toolbar">
            <p class="products-count">Hiển thị <strong th:text="${#lists.size(products)}"></strong> sản phẩm</p>
            <div class="sort-dropdown" id="sort-dropdown">
                <button class="sort-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M3 6h18M7 12h10M11 18h2"/>
                    </svg>
                    <span id="sort-label">Sắp xếp</span>
                    <svg class="sort-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <ul class="sort-menu">
                    <li class="sort-option active" data-value="default">Mặc định</li>
                    <li class="sort-option" data-value="price-asc">Giá: Thấp → Cao</li>
                    <li class="sort-option" data-value="price-desc">Giá: Cao → Thấp</li>
                    <li class="sort-option" data-value="name">Tên A-Z</li>
                    <li class="sort-option" data-value="discount-desc">Giảm giá nhiều nhất</li>
                </ul>
            </div>
        </div>

        <!-- Quần Sịp -->
        <div class="section-divider" id="section-quan-sip"><h2>Quần Sịp Nam</h2></div>
        <div class="product-grid">
            <th:block th:each="product : ${products}" th:if="${product.category == 'quan-sip'}">
                <div th:replace="~{fragments/product-card :: card(product=${product})}"></div>
            </th:block>
        </div>

        <!-- Ví Da -->
        <div class="section-divider" id="section-vi-da"><h2>Ví Da Cao Cấp</h2></div>
        <div class="product-grid">
            <th:block th:each="product : ${products}" th:if="${product.category == 'vi-da'}">
                <div th:replace="~{fragments/product-card :: card(product=${product})}"></div>
            </th:block>
        </div>

        <!-- Thắt Lưng -->
        <div class="section-divider" id="section-that-lung"><h2>Thắt Lưng Da</h2></div>
        <div class="product-grid">
            <th:block th:each="product : ${products}" th:if="${product.category == 'that-lung'}">
                <div th:replace="~{fragments/product-card :: card(product=${product})}"></div>
            </th:block>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: bottom}"></div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
