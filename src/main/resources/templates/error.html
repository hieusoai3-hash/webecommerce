<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status} + ' - NB2 Boxer Men'">Lỗi - NB2 Boxer Men</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--color-gray-50);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: var(--color-accent);
            line-height: 1;
            margin-bottom: 16px;
            opacity: 0.15;
        }
        .error-content {
            max-width: 500px;
            margin: 0 auto;
        }
        .error-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: 12px;
        }
        .error-desc {
            color: var(--color-gray-500);
            font-size: 1.05rem;
            margin-bottom: 32px;
            line-height: 1.7;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: top}"></div>

<section class="error-page">
    <div class="error-content">
        <div class="error-code" th:text="${status}">404</div>
        <h1 class="error-title" th:text="${status == 404} ? 'Trang Không Tìm Thấy' : 'Đã Xảy Ra Lỗi'">Trang Không Tìm Thấy</h1>
        <p class="error-desc" th:text="${status == 404} ? 'Trang bạn đang tìm không tồn tại hoặc đã bị di chuyển.' : 'Đã có lỗi xảy ra. Vui lòng thử lại sau.'">
            Trang bạn đang tìm không tồn tại hoặc đã bị di chuyển.
        </p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary btn-lg">Về Trang Chủ</a>
            <a th:href="@{/san-pham}" class="btn btn-outline btn-lg">Xem Sản Phẩm</a>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: bottom}"></div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
