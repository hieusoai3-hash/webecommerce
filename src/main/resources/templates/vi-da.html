<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví Da Nam - NB2 Boxer Men</title>
    <meta name="description" content="Ví da nam cao cấp NB2 Boxer Men - Da Microfiber, RFID, Khắc tên.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: top}"></div>

<!-- Page Hero -->
<section class="page-hero">
    <div class="page-hero-content">
        <div class="container">
            <div class="breadcrumb">
                <a th:href="@{/}">Trang chủ</a> <span>&#8250;</span>
                <a th:href="@{/san-pham}">Sản phẩm</a> <span>&#8250;</span>
                <span style="color:#fff;">Ví Da Nam</span>
            </div>
            <h1>Ví Da Nam Cao Cấp</h1>
            <p>Sang trọng, lịch lãm với chất liệu da Microfiber cao cấp</p>
            <div class="category-nav">
                <a th:href="@{/san-pham}" class="category-pill">Tất cả</a>
                <a th:href="@{/quan-sip}" class="category-pill">Quần sịp</a>
                <a th:href="@{/vi-da}" class="category-pill active">Ví da</a>
                <a th:href="@{/that-lung}" class="category-pill">Thắt lưng</a>
            </div>
        </div>
    </div>
</section>

<!-- Products Section -->
<section class="products" id="products" style="padding-top: 50px;">
    <div class="container">
        <div class="products-toolbar">
            <p class="products-count">Hiển thị <strong th:text="${#lists.size(products)}"></strong> sản phẩm</p>
            <select class="sort-select" id="sort-select">
                <option value="default">Sắp xếp: Mặc định</option>
                <option value="price-asc">Giá: Thấp &#8594; Cao</option>
                <option value="price-desc">Giá: Cao &#8594; Thấp</option>
                <option value="name">Tên A-Z</option>
            </select>
        </div>
        <div class="product-grid" id="product-grid">
            <th:block th:each="product : ${products}">
                <div th:replace="~{fragments/product-card :: card(product=${product})}"></div>
            </th:block>
        </div>
    </div>
</section>

<div th:replace="~{fragments/size-guide :: guide('vi-da')}"></div>

<div th:replace="~{fragments/footer :: bottom}"></div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
