<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quần Sịp Nam - NB2 Boxer Men</title>
    <meta name="description" content="Quần lót nam cao cấp NB2 Boxer Men - Bamboo, Modal, Cotton Compact.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: top}"></div>

<!-- Page Hero -->
<section class="page-hero">
    <div class="page-hero-content">
        <div class="container">
            <div class="breadcrumb">
                <a th:href="@{/}">Trang chủ</a> <span>&#8250;</span>
                <a th:href="@{/san-pham}">Sản phẩm</a> <span>&#8250;</span>
                <span style="color:#fff;">Quần Sịp Nam</span>
            </div>
            <h1>Quần Sịp Nam</h1>
            <p>Thoải mái tối đa với chất liệu cao cấp - Bamboo, Lenzing Modal &amp; Cotton Compact</p>
            <div class="category-nav">
                <a th:href="@{/san-pham}" class="category-pill">Tất cả</a>
                <a th:href="@{/quan-sip}" class="category-pill active">Quần sịp</a>
                <a th:href="@{/vi-da}" class="category-pill">Ví da</a>
                <a th:href="@{/that-lung}" class="category-pill">Thắt lưng</a>
            </div>
        </div>
    </div>
</section>

<!-- Products Section -->
<section class="products" id="products" style="padding-top: 50px;">
    <div class="container">
        <div class="products-toolbar">
            <p class="products-count">Hiển thị <strong th:text="${#lists.size(products)}"></strong> sản phẩm</p>
            <div class="sort-dropdown" id="sort-dropdown">
                <button class="sort-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M3 6h18M7 12h10M11 18h2"/>
                    </svg>
                    <span id="sort-label">Sắp xếp</span>
                    <svg class="sort-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <ul class="sort-menu">
                    <li class="sort-option active" data-value="default">Mặc định</li>
                    <li class="sort-option" data-value="price-asc">Giá: Thấp → Cao</li>
                    <li class="sort-option" data-value="price-desc">Giá: Cao → Thấp</li>
                    <li class="sort-option" data-value="name">Tên A-Z</li>
                    <li class="sort-option" data-value="discount-desc">Giảm giá nhiều nhất</li>
                </ul>
            </div>
        </div>
        <div class="product-grid" id="product-grid">
            <th:block th:each="product : ${products}">
                <div th:replace="~{fragments/product-card :: card(product=${product})}"></div>
            </th:block>
        </div>
    </div>
</section>

<div th:replace="~{fragments/size-guide :: guide('quan-sip')}"></div>

<div th:replace="~{fragments/footer :: bottom}"></div>

<script th:src="@{/js/data/provinces.js}"></script>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
