<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="top">
    <!-- Announcement Bar -->
    <div class="announcement-bar" id="announcement-bar"
         th:if="${siteSettings == null or siteSettings.bannerEnabled}">
        <div class="container">
            <p th:text="${siteSettings != null ? siteSettings.bannerText : '🔥 FLASH SALE'}">🔥 FLASH SALE</p>
        </div>
        <button class="announcement-close" id="announcement-close" aria-label="Đóng thông báo">&times;</button>
    </div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="container header-inner">
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>

            <a th:href="@{/}" class="logo" id="logo">
                <span class="logo-icon">&#9670;</span> NB2 Boxer Men
            </a>

            <nav class="main-nav" id="main-nav">
                <button class="nav-close-btn" id="nav-close-btn" aria-label="Đóng menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
                <ul class="nav-list">
                    <li class="nav-item">
                        <a th:href="@{/}" class="nav-link" th:classappend="${activePage == 'home'} ? ' active'">TRANG CHỦ</a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/san-pham}" class="nav-link"
                           th:classappend="${activePage == 'san-pham' or activePage == 'quan-sip' or activePage == 'vi-da' or activePage == 'that-lung'} ? ' active'">SẢN PHẨM</a>
                        <div class="mega-menu">
                            <div class="mega-menu-inner">
                                <div class="mega-col">
                                    <h4>Danh Mục</h4>
                                    <a th:href="@{/quan-sip}" class="mega-link">
                                        <span class="mega-link-icon">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                                        </span>
                                        <span class="mega-link-text">
                                            <span class="mega-link-name">Quần sịp</span>
                                            <span class="mega-link-desc">Bamboo, Modal, Cotton</span>
                                        </span>
                                    </a>
                                    <a th:href="@{/vi-da}" class="mega-link">
                                        <span class="mega-link-icon">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="2"/></svg>
                                        </span>
                                        <span class="mega-link-text">
                                            <span class="mega-link-name">Ví da</span>
                                            <span class="mega-link-desc">Da bò thật, Da PU cao cấp</span>
                                        </span>
                                    </a>
                                    <a th:href="@{/that-lung}" class="mega-link">
                                        <span class="mega-link-icon">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                                        </span>
                                        <span class="mega-link-text">
                                            <span class="mega-link-name">Thắt lưng</span>
                                            <span class="mega-link-desc">Da bò thật 100%</span>
                                        </span>
                                    </a>
                                    <a th:href="@{/san-pham}" class="mega-view-all">Xem tất cả sản phẩm &rarr;</a>
                                </div>
                            </div>
                        </div>
                    </li>
                    <li class="nav-item"><a th:href="@{/#products}" class="nav-link">BÁN CHẠY</a></li>
                    <li class="nav-item">
                        <a th:href="@{/sale}" class="nav-link nav-sale" th:classappend="${activePage == 'sale'} ? ' active'">SALE</a>
                    </li>
                    <li class="nav-item"><a th:href="@{/ve-chung-toi}" class="nav-link" th:classappend="${activePage == 've-chung-toi'} ? ' active'">VỀ CHÚNG TÔI</a></li>
                    <li class="nav-item"><a th:href="@{/tra-don-hang}" class="nav-link" th:classappend="${activePage == 'tra-don-hang'} ? ' active'">TRA CỨU ĐƠN</a></li>
                </ul>
            </nav>

            <div class="search-bar" id="search-bar">
                <button class="search-toggle" id="search-toggle" aria-label="Tìm kiếm">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <input type="text" class="search-input" id="search-input"
                       placeholder="Tìm kiếm sản phẩm..." autocomplete="off">
                <div class="search-dropdown" id="search-dropdown"></div>
            </div>

            <div class="header-actions">
                <button class="action-btn cart-btn" id="cart-btn" aria-label="Giỏ hàng">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span class="cart-count" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>
</div>

</body>
</html>
