<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="sidebar">
<button class="sidebar-open-btn" id="sidebar-open-btn" aria-label="Menu">
    <i class="bi bi-list"></i>
</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header-row">
    <a th:href="@{/admin/dashboard}" class="sidebar-brand">
        <div class="brand-icon">&#9670;</div>
        <div class="brand-text">
            NB2 Admin
            <span>Boxer Men</span>
        </div>
    </a>
    <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Đóng">
        <i class="bi bi-x-lg"></i>
    </button>
    </div>

    <nav class="sidebar-nav" style="margin-top: 8px;">
        <div class="sidebar-section">Tổng quan</div>
        <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <div class="sidebar-section">Quản lý</div>
        <a th:href="@{/admin/products}" th:classappend="${activePage == 'products'} ? ' active'">
            <i class="bi bi-box-seam"></i> Sản phẩm
        </a>
        <a th:href="@{/admin/orders}" th:classappend="${activePage == 'orders'} ? ' active'"
           style="display:flex; align-items:center; justify-content:space-between;">
            <span><i class="bi bi-bag-check"></i> Đơn hàng</span>
            <span th:if="${newOrderBadge != null and newOrderBadge > 0}"
                  id="order-badge"
                  style="background:#ef4444; color:#fff; border-radius:99px;
                         font-size:.65rem; font-weight:700; padding:2px 7px; min-width:20px;
                         text-align:center; line-height:16px;"
                  th:text="${newOrderBadge}"></span>
        </a>
        <a th:href="@{/admin/customers}" th:classappend="${activePage == 'customers'} ? ' active'">
            <i class="bi bi-people"></i> Khách hàng
        </a>
        <a th:href="@{/admin/combos}" th:classappend="${activePage == 'combos'} ? ' active'">
            <i class="bi bi-gift"></i> Combo Hot
        </a>
        <a th:href="@{/admin/coupons}" th:classappend="${activePage == 'coupons'} ? ' active'">
            <i class="bi bi-ticket-perforated"></i> Mã Giảm Giá
        </a>
        <a th:href="@{/admin/settings}" th:classappend="${activePage == 'settings'} ? ' active'">
            <i class="bi bi-gear"></i> Cài Đặt
        </a>

        <div class="sidebar-divider" style="margin-top: auto;"></div>
        <a th:href="@{/}" target="_blank">
            <i class="bi bi-shop"></i> Xem cửa hàng
        </a>
        <form th:action="@{/admin/logout}" method="post" style="margin:0;">
            <button type="submit"
                    style="display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;
                           background:none;border:none;color:rgba(255,255,255,.65);font-size:.875rem;
                           font-family:inherit;cursor:pointer;border-left:3px solid transparent;
                           transition:all .18s;text-align:left;"
                    onmouseover="this.style.color='#fff';this.style.background='rgba(255,255,255,.07)'"
                    onmouseout="this.style.color='rgba(255,255,255,.65)';this.style.background='none'">
                <i class="bi bi-box-arrow-right" style="font-size:1rem;width:18px;flex-shrink:0;"></i> Đăng xuất
            </button>
        </form>
    </nav>
</aside>
<script>
(function(){
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    var openBtn = document.getElementById('sidebar-open-btn');
    var closeBtn = document.getElementById('sidebar-close-btn');
    function openSidebar(){
        sidebar.classList.add('open');
        overlay.classList.add('active');
        document.body.style.overflow='hidden';
    }
    function closeSidebar(){
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
        document.body.style.overflow='';
    }
    if(openBtn)  openBtn.addEventListener('click', openSidebar);
    if(closeBtn) closeBtn.addEventListener('click', closeSidebar);
    if(overlay)  overlay.addEventListener('click', closeSidebar);
})();
</script>
</th:block>

</body>
</html>
