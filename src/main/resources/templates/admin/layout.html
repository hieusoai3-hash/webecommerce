<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="sidebar">
<button class="sidebar-open-btn" id="sidebar-open-btn" aria-label="Menu">
    <i class="bi bi-list"></i>
</button>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header-row">
    <a th:href="@{/admin/dashboard}" class="sidebar-brand">
        <div class="brand-icon">&#9670;</div>
        <div class="brand-text">
            NB2 Admin
            <span>Boxer Men</span>
        </div>
    </a>
    <button class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Đóng">
        <i class="bi bi-x-lg"></i>
    </button>
    </div>

    <nav class="sidebar-nav" style="margin-top: 8px;">
        <div class="sidebar-section">Tổng quan</div>
        <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active'">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <div class="sidebar-section">Quản lý</div>
        <a th:href="@{/admin/products}" th:classappend="${activePage == 'products'} ? ' active'">
            <i class="bi bi-box-seam"></i> Sản phẩm
        </a>
        <a th:href="@{/admin/orders}" th:classappend="${activePage == 'orders'} ? ' active'"
           style="display:flex; align-items:center; justify-content:space-between;">
            <span><i class="bi bi-bag-check"></i> Đơn hàng</span>
            <span th:if="${newOrderBadge != null and newOrderBadge > 0}"
                  id="order-badge"
                  style="background:#ef4444; color:#fff; border-radius:99px;
                         font-size:.65rem; font-weight:700; padding:2px 7px; min-width:20px;
                         text-align:center; line-height:16px;"
                  th:text="${newOrderBadge}"></span>
        </a>
        <a th:href="@{/admin/customers}" th:classappend="${activePage == 'customers'} ? ' active'">
            <i class="bi bi-people"></i> Khách hàng
        </a>
        <a th:href="@{/admin/combos}" th:classappend="${activePage == 'combos'} ? ' active'">
            <i class="bi bi-gift"></i> Combo Hot
        </a>
        <a th:href="@{/admin/coupons}" th:classappend="${activePage == 'coupons'} ? ' active'">
            <i class="bi bi-ticket-perforated"></i> Mã Giảm Giá
        </a>
        <a th:href="@{/admin/settings}" th:classappend="${activePage == 'settings'} ? ' active'">
            <i class="bi bi-gear"></i> Cài Đặt
        </a>

        <div class="sidebar-divider" style="margin-top: auto;"></div>
        <a th:href="@{/}" target="_blank">
            <i class="bi bi-shop"></i> Xem cửa hàng
        </a>
        <form th:action="@{/admin/logout}" method="post" style="margin:0;">
            <button type="submit"
                    style="display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;
                           background:none;border:none;color:rgba(255,255,255,.65);font-size:.875rem;
                           font-family:inherit;cursor:pointer;border-left:3px solid transparent;
                           transition:all .18s;text-align:left;"
                    onmouseover="this.style.color='#fff';this.style.background='rgba(255,255,255,.07)'"
                    onmouseout="this.style.color='rgba(255,255,255,.65)';this.style.background='none'">
                <i class="bi bi-box-arrow-right" style="font-size:1rem;width:18px;flex-shrink:0;"></i> Đăng xuất
            </button>
        </form>
    </nav>
</aside>
<!-- Order notification toast -->
<div id="order-toast" style="
    position:fixed; top:20px; right:20px; z-index:9999;
    background:#1e1e2e; color:#fff;
    border-left:4px solid #e94560;
    border-radius:12px;
    padding:14px 18px;
    min-width:280px; max-width:340px;
    box-shadow:0 8px 32px rgba(0,0,0,.35);
    display:flex; align-items:flex-start; gap:12px;
    transform:translateX(120%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    cursor:pointer;">
    <div style="font-size:1.4rem;line-height:1;flex-shrink:0;">🔔</div>
    <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:.88rem;margin-bottom:3px;">Đơn hàng mới!</div>
        <div id="toast-body" style="font-size:.78rem;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></div>
        <div style="font-size:.7rem;color:rgba(255,255,255,.4);margin-top:6px;">Nhấn để xem đơn hàng →</div>
    </div>
    <button onclick="document.getElementById('order-toast').style.transform='translateX(120%)'"
            style="background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;
                   font-size:1rem;padding:0;line-height:1;flex-shrink:0;">✕</button>
</div>

<script>
(function(){
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    var openBtn = document.getElementById('sidebar-open-btn');
    var closeBtn = document.getElementById('sidebar-close-btn');
    function openSidebar(){
        sidebar.classList.add('open');
        overlay.classList.add('active');
        document.body.style.overflow='hidden';
    }
    function closeSidebar(){
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
        document.body.style.overflow='';
    }
    if(openBtn)  openBtn.addEventListener('click', openSidebar);
    if(closeBtn) closeBtn.addEventListener('click', closeSidebar);
    if(overlay)  overlay.addEventListener('click', closeSidebar);
})();

// ── New order polling ──────────────────────────────────────────────────
(function(){
    var knownLatestId = null;
    var isFirstPoll = true;
    var toast = document.getElementById('order-toast');
    var toastBody = document.getElementById('toast-body');
    var badge = document.getElementById('order-badge');
    var toastTimer = null;

    // Navigate to orders on toast click
    if (toast) {
        toast.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') return;
            window.location.href = '/admin/orders';
        });
    }

    function formatVnd(n) {
        return Number(n).toLocaleString('vi-VN') + '₫';
    }

    function showToast(name, total) {
        if (!toast) return;
        toastBody.textContent = (name || 'Khách hàng') + ' — ' + formatVnd(total || 0);
        toast.style.transform = 'translateX(0)';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
            toast.style.transform = 'translateX(120%)';
        }, 6000);
        // Browser notification (if granted)
        if (Notification && Notification.permission === 'granted') {
            new Notification('🔔 Đơn hàng mới — NB2 Admin', {
                body: (name || 'Khách hàng') + ' vừa đặt hàng ' + formatVnd(total || 0),
                icon: '/images/banners/hero_banner.png'
            });
        }
    }

    function updateBadge(count) {
        if (!badge) return;
        badge.textContent = count;
        badge.style.display = count > 0 ? '' : 'none';
    }

    function poll() {
        fetch('/admin/orders/poll', { credentials: 'same-origin' })
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(data) {
                if (!data) return;
                updateBadge(data.pending || 0);
                if (isFirstPoll) {
                    knownLatestId = data.latestId;
                    isFirstPoll = false;
                    return;
                }
                if (data.latestId && data.latestId !== knownLatestId) {
                    knownLatestId = data.latestId;
                    showToast(data.latestName, data.latestTotal);
                }
            })
            .catch(function() {}); // silent fail
    }

    // Request browser notification permission once
    if (Notification && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    setInterval(poll, 30000); // Poll every 30 s
})();
</script>
</th:block>

</body>
</html>
