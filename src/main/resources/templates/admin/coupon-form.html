<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isNew} ? 'Thêm Mã - NB2 Admin' : 'Sửa Mã - NB2 Admin'">Mã giảm giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/layout :: sidebar}" th:with="activePage='coupons'"></div>

<div class="admin-wrapper">
    <div class="topbar">
        <a th:href="@{/admin/coupons}" class="btn-nb2 btn-outline btn-sm"><i class="bi bi-arrow-left"></i></a>
        <h1 th:text="${isNew} ? 'Tạo mã giảm giá mới' : 'Chỉnh sửa mã: ' + ${coupon.code}">Mã giảm giá</h1>
    </div>

    <div class="content-area">
        <form th:action="@{/admin/coupons/save}" method="post">
            <input th:if="${!isNew}" type="hidden" name="id" th:value="${coupon.id}">

            <div class="row-2-1" style="align-items:start;">
                <!-- Left -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h6><i class="bi bi-ticket-perforated me-2" style="color:var(--accent)"></i>Thông tin mã</h6>
                    </div>
                    <div class="admin-card-body">

                        <div class="form-group">
                            <label class="form-label">Mã giảm giá <span style="color:var(--accent)">*</span></label>
                            <input type="text" name="code" class="form-control"
                                   th:value="${coupon.code}" required placeholder="vd: NB2SALE20"
                                   style="text-transform:uppercase;font-weight:700;letter-spacing:.05em;"
                                   oninput="this.value=this.value.toUpperCase()">
                            <div class="form-hint">Chỉ dùng chữ hoa và số, không dấu cách</div>
                        </div>

                        <div class="row-2">
                            <div class="form-group">
                                <label class="form-label">Loại giảm giá</label>
                                <select name="discountType" id="discountType" class="form-control" onchange="updateLabel()">
                                    <option value="PERCENT" th:selected="${coupon.discountType == 'PERCENT'}">Phần trăm (%)</option>
                                    <option value="FIXED"   th:selected="${coupon.discountType == 'FIXED'}">Số tiền cố định (₫)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" id="valueLabel">Giá trị giảm</label>
                                <input type="number" name="discountValue" class="form-control"
                                       th:value="${coupon.discountValue}" min="1" required>
                                <div class="form-hint" id="valueHint">Nhập % (vd: 20 = giảm 20%)</div>
                            </div>
                        </div>

                        <div class="row-2">
                            <div class="form-group">
                                <label class="form-label">Đơn tối thiểu (₫)</label>
                                <input type="number" name="minOrderValue" class="form-control"
                                       th:value="${coupon.minOrderValue}" min="0" placeholder="0 = không giới hạn">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Số lần dùng tối đa</label>
                                <input type="number" name="maxUses" class="form-control"
                                       th:value="${coupon.maxUses}" min="0" placeholder="0 = không giới hạn">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Ngày hết hạn <span class="hint">(để trống = không hết hạn)</span></label>
                            <input type="date" name="expiresAt" class="form-control"
                                   th:value="${coupon.expiresAt}">
                        </div>

                    </div>
                </div>

                <!-- Right -->
                <div class="admin-card" style="position:sticky;top:calc(var(--topbar-height)+16px);">
                    <div class="admin-card-header">
                        <h6><i class="bi bi-gear me-2" style="color:var(--accent)"></i>Cài đặt</h6>
                    </div>
                    <div class="admin-card-body" style="display:flex;flex-direction:column;gap:14px;">

                        <div class="form-check">
                            <input type="checkbox" name="active" id="active" class="form-check-input"
                                   value="true" th:checked="${coupon.active or isNew}">
                            <label for="active" class="form-label" style="margin-bottom:0;cursor:pointer;">
                                <i class="bi bi-eye" style="color:var(--success);"></i> Kích hoạt mã
                            </label>
                        </div>

                        <div th:if="${!isNew}" style="font-size:.82rem;color:var(--text-muted);padding:10px;background:var(--surface);border-radius:8px;">
                            <div>Đã dùng: <strong th:text="${coupon.usedCount}"></strong> lần</div>
                        </div>

                        <button type="submit" class="btn-nb2 btn-accent btn-lg btn-full">
                            <i class="bi bi-check-lg"></i>
                            <span th:text="${isNew} ? 'Tạo mã' : 'Lưu thay đổi'">Lưu</span>
                        </button>
                        <a th:href="@{/admin/coupons}" class="btn-nb2 btn-outline btn-full">Hủy</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<script>
function updateLabel() {
    const type = document.getElementById('discountType').value;
    document.getElementById('valueLabel').textContent = type === 'PERCENT' ? 'Giá trị giảm (%)' : 'Số tiền giảm (₫)';
    document.getElementById('valueHint').textContent  = type === 'PERCENT' ? 'vd: 20 = giảm 20%' : 'vd: 50000 = giảm 50.000₫';
}
updateLabel();
</script>
</body>
</html>
