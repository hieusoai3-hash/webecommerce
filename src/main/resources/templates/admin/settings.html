<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt - NB2 Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/layout :: sidebar}" th:with="activePage='settings'"></div>

<div class="admin-wrapper">
    <div class="topbar">
        <h1>Cài Đặt</h1>
    </div>

    <div class="content-area">
        <div th:if="${success}" class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
        </div>

        <form th:action="@{/admin/settings}" method="post" id="settings-form">

            <!-- Banner thông báo -->
            <div class="admin-card" style="margin-bottom: 24px;">
                <div class="admin-card-header">
                    <h6><i class="bi bi-megaphone me-2" style="color:var(--accent)"></i>Banner thông báo</h6>
                </div>
                <div class="admin-card-body">

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label class="form-label">Trạng thái</label>
                        <div style="display:flex; align-items:center; gap:12px; margin-top:6px;">
                            <label class="toggle-switch">
                                <input type="checkbox" name="bannerEnabled" id="bannerEnabled"
                                       th:checked="${settings.bannerEnabled}">
                                <span class="toggle-slider"></span>
                            </label>
                            <span style="font-size:.875rem; color:var(--text-muted);">Hiển thị banner trên đầu trang</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="bannerText">Nội dung banner</label>
                        <input type="text" class="form-control" id="bannerText" name="bannerText"
                               th:value="${settings.bannerText}"
                               placeholder="Ví dụ: 🔥 FLASH SALE - Giảm đến 40% | Mua 3 tặng 1">
                        <div style="margin-top:10px; padding:12px 16px; border-radius:6px;
                                    background:linear-gradient(135deg,#e94560,#c0392b); color:#fff;
                                    font-size:.85rem; text-align:center;" id="banner-preview">
                            <span id="preview-text" th:text="${settings.bannerText}"></span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Flash Sale -->
            <div class="admin-card" style="margin-bottom: 24px;">
                <div class="admin-card-header">
                    <h6><i class="bi bi-lightning-charge me-2" style="color:var(--accent)"></i>Flash Sale — Bộ đếm ngược</h6>
                </div>
                <div class="admin-card-body">

                    <div class="form-group">
                        <label class="form-label" for="saleEndDatetime">Thời điểm kết thúc sale</label>
                        <input type="datetime-local" class="form-control" id="saleEndDatetime"
                               style="max-width:320px;">
                        <input type="hidden" name="saleEndEpoch" id="saleEndEpoch"
                               th:value="${settings.saleEndEpoch}">
                        <p style="margin-top:6px; font-size:.8rem; color:var(--text-muted);">
                            Để trống hoặc đặt về 0 để bộ đếm tự động dùng localStorage của khách hàng (3 ngày từ lần đầu vào trang).
                        </p>
                    </div>

                    <div th:if="${settings.saleEndEpoch > 0}"
                         style="margin-top:8px; padding:10px 14px; border-radius:6px;
                                background:rgba(233,69,96,.08); border:1px solid rgba(233,69,96,.2);
                                font-size:.85rem; color:var(--accent);">
                        <i class="bi bi-clock"></i>
                        Đang đếm đến: <strong id="current-end-display"></strong>
                    </div>

                </div>
            </div>

            <!-- Contact info -->
            <div class="admin-card" style="margin-bottom: 24px;">
                <div class="admin-card-header">
                    <h6><i class="bi bi-telephone me-2" style="color:var(--accent)"></i>Thông tin liên hệ</h6>
                </div>
                <div class="admin-card-body">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                        <div class="form-group">
                            <label class="form-label">Số điện thoại</label>
                            <input type="text" class="form-control" name="shopPhone"
                                   th:value="${settings.shopPhone}" placeholder="Ví dụ: 0912 345 678">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="shopEmail"
                                   th:value="${settings.shopEmail}" placeholder="Ví dụ: shop@nb2boxer.com">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top:14px;">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" class="form-control" name="shopAddress"
                               th:value="${settings.shopAddress}" placeholder="Ví dụ: 123 Nguyễn Trãi, Q.5, TP.HCM">
                    </div>
                </div>
            </div>

            <!-- Social media -->
            <div class="admin-card" style="margin-bottom: 24px;">
                <div class="admin-card-header">
                    <h6><i class="bi bi-share me-2" style="color:var(--accent)"></i>Mạng xã hội</h6>
                </div>
                <div class="admin-card-body">
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
                        <div class="form-group">
                            <label class="form-label" style="display:flex; align-items:center; gap:6px;">
                                <i class="bi bi-facebook" style="color:#1877f2;"></i> Facebook
                            </label>
                            <input type="url" class="form-control" name="facebookUrl"
                                   th:value="${settings.facebookUrl}" placeholder="https://facebook.com/…">
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="display:flex; align-items:center; gap:6px;">
                                <i class="bi bi-chat-dots-fill" style="color:#0068ff;"></i> Zalo
                            </label>
                            <input type="text" class="form-control" name="zaloPhone"
                                   th:value="${settings.zaloPhone}" placeholder="Số điện thoại Zalo">
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="display:flex; align-items:center; gap:6px;">
                                <i class="bi bi-tiktok" style="color:#000;"></i> TikTok
                            </label>
                            <input type="url" class="form-control" name="tiktokUrl"
                                   th:value="${settings.tiktokUrl}" placeholder="https://tiktok.com/@…">
                        </div>
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:12px;">
                <button type="submit" class="btn-nb2 btn-accent">
                    <i class="bi bi-floppy"></i> Lưu cài đặt
                </button>
            </div>

        </form>

        <!-- Change password (separate form) -->
        <div class="admin-card" style="margin-top: 24px;">
            <div class="admin-card-header">
                <h6><i class="bi bi-shield-lock me-2" style="color:var(--accent)"></i>Đổi mật khẩu Admin</h6>
            </div>
            <div class="admin-card-body">
                <div th:if="${pwError}" class="alert alert-danger" style="margin-bottom:16px;">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${pwError}"></span>
                </div>
                <form th:action="@{/admin/settings/change-password}" method="post">
                    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
                        <div class="form-group">
                            <label class="form-label">Mật khẩu hiện tại</label>
                            <input type="password" class="form-control" name="currentPassword"
                                   required autocomplete="current-password">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="password" class="form-control" name="newPassword"
                                   required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Xác nhận mật khẩu mới</label>
                            <input type="password" class="form-control" name="confirmPassword"
                                   required minlength="6" autocomplete="new-password">
                        </div>
                    </div>
                    <div style="margin-top:16px; display:flex; align-items:center; gap:12px;">
                        <button type="submit" class="btn-nb2 btn-primary">
                            <i class="bi bi-key"></i> Đổi mật khẩu
                        </button>
                        <span style="font-size:.78rem; color:var(--text-soft);">
                            <i class="bi bi-info-circle"></i> Tối thiểu 6 ký tự
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .toggle-switch { position:relative; display:inline-block; width:44px; height:24px; }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider {
        position:absolute; cursor:pointer; inset:0;
        background:#ccc; border-radius:24px; transition:.2s;
    }
    .toggle-slider::before {
        content:''; position:absolute;
        width:18px; height:18px; left:3px; bottom:3px;
        background:#fff; border-radius:50%; transition:.2s;
    }
    .toggle-switch input:checked + .toggle-slider { background:var(--accent); }
    .toggle-switch input:checked + .toggle-slider::before { transform:translateX(20px); }
</style>

<script>
    // Live preview
    document.getElementById('bannerText').addEventListener('input', function () {
        document.getElementById('preview-text').textContent = this.value || 'Nội dung banner...';
    });

    // Convert epoch → datetime-local input
    const epochInput = document.getElementById('saleEndEpoch');
    const dtInput    = document.getElementById('saleEndDatetime');
    const epoch      = parseInt(epochInput.value) || 0;

    if (epoch > 0) {
        const d = new Date(epoch);
        // Format for datetime-local: YYYY-MM-DDTHH:mm
        const pad = n => String(n).padStart(2, '0');
        dtInput.value = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
                      + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());

        const display = document.getElementById('current-end-display');
        if (display) display.textContent = d.toLocaleString('vi-VN');
    }

    // Convert datetime-local → epoch before submit
    document.getElementById('settings-form').addEventListener('submit', function () {
        const val = dtInput.value;
        epochInput.value = val ? new Date(val).getTime() : 0;
    });
</script>

</body>
</html>
