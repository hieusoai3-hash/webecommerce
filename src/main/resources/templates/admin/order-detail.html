<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết đơn hàng - NB2 Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        /* grid */
        .od-grid { display:grid; grid-template-columns:1fr 272px; gap:14px; align-items:start; }
        @media(max-width:820px){ .od-grid{grid-template-columns:1fr;} }

        /* ── Status strip ─── */
        .od-status-card {
            background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);
            padding:14px 20px; margin-bottom:14px;
            display:flex; align-items:center; gap:20px;
        }
        .tl { display:flex; align-items:center; flex:1; min-width:0; }
        .tl-step { display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
        .tl-step::after {
            content:''; position:absolute;
            top:12px; left:calc(50% + 13px); right:calc(-50% + 13px);
            height:2px; background:var(--border); z-index:0;
        }
        .tl-step:last-child::after { display:none; }
        .tl-step.tl-done::after  { background:var(--success); }
        .tl-step.tl-active::after{ background:var(--accent); }
        .tl-dot {
            width:24px; height:24px; border-radius:50%;
            border:2px solid var(--border); background:var(--surface);
            color:var(--text-soft); display:flex; align-items:center; justify-content:center;
            font-size:.62rem; font-weight:800; position:relative; z-index:1; flex-shrink:0;
        }
        .tl-dot.done  { background:var(--success); border-color:var(--success); color:#fff; }
        .tl-dot.active{ background:var(--accent);  border-color:var(--accent);  color:#fff; }
        .tl-dot.paid  { background:#7c3aed; border-color:#7c3aed; color:#fff; }
        .tl-lbl {
            font-size:.6rem; font-weight:500; color:var(--text-soft);
            margin-top:4px; text-align:center; white-space:nowrap;
        }
        .tl-lbl.done  { color:var(--success); font-weight:700; }
        .tl-lbl.active{ color:var(--accent);  font-weight:700; }
        .tl-lbl.paid  { color:#7c3aed; font-weight:700; }

        .od-status-right { display:flex; gap:6px; align-items:center; flex-shrink:0; }
        .status-sel {
            height:30px; padding:0 8px 0 10px;
            border:1.5px solid var(--border); border-radius:var(--radius-sm);
            background:var(--surface); color:var(--text); font-size:.8rem;
            font-family:inherit; outline:none; cursor:pointer; min-width:130px;
        }
        .status-sel:focus{ border-color:var(--accent); }

        /* ── Items card ── */
        .od-items-card {
            background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden;
        }
        .od-items-head {
            display:flex; align-items:center; justify-content:space-between;
            padding:12px 16px; border-bottom:1px solid var(--border);
        }
        .od-items-head h6 { font-size:.85rem; font-weight:700; color:var(--text); margin:0; }
        .od-table { width:100%; border-collapse:collapse; font-size:.83rem; }
        .od-table th {
            padding:7px 14px; background:var(--bg); text-align:left;
            font-size:.68rem; font-weight:700; color:var(--text-muted);
            text-transform:uppercase; letter-spacing:.06em;
        }
        .od-table th.r, .od-table td.r { text-align:right; }
        .od-table th.c, .od-table td.c { text-align:center; }
        .od-table td { padding:10px 14px; border-top:1px solid var(--border); vertical-align:middle; }
        .od-table tr:hover td { background:#fafbfc; }
        .sz { display:inline-block; padding:1px 6px; background:var(--bg);
              border-radius:4px; font-size:.72rem; font-weight:600; color:var(--text-muted); }
        .od-total {
            display:flex; justify-content:flex-end; align-items:baseline; gap:12px;
            padding:10px 14px; border-top:2px solid var(--border);
        }
        .od-total-lbl { font-size:.78rem; font-weight:600; color:var(--text-muted); }
        .od-total-val { font-size:1.1rem; font-weight:900; color:var(--accent); }

        /* ── Sidebar card ── */
        .od-side-card {
            background:var(--surface); border:1px solid var(--border);
            border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden;
        }
        .od-side-sec { padding:14px 16px; }
        .od-side-sec + .od-side-sec { border-top:1px solid var(--border); }
        .od-sec-title {
            font-size:.63rem; font-weight:700; text-transform:uppercase;
            letter-spacing:.09em; color:var(--text-soft); margin-bottom:9px;
        }

        /* customer block */
        .od-cust-name { font-size:.95rem; font-weight:700; color:var(--text); margin-bottom:5px; }
        .od-cust-row  { display:flex; align-items:flex-start; gap:7px; font-size:.8rem;
                        color:var(--text-muted); margin-bottom:4px; }
        .od-cust-row:last-child { margin-bottom:0; }
        .od-cust-row i { margin-top:2px; flex-shrink:0; }

        /* meta block */
        .od-meta { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:.8rem; }
        .od-meta-k { color:var(--text-muted); white-space:nowrap; padding:2px 0; }
        .od-meta-v { font-weight:600; color:var(--text); padding:2px 0; }
    </style>
</head>
<body>
<div th:replace="~{admin/layout :: sidebar}" th:with="activePage='orders'"></div>

<div class="admin-wrapper">
    <div class="topbar">
        <a th:href="@{/admin/orders}" class="btn-nb2 btn-outline btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1 th:text="${order != null} ? ('Đơn ' + ${order.id}) : 'Chi tiết đơn hàng'"></h1>
        <span th:if="${order != null}" class="badge"
              th:classappend="${order.status=='PENDING'} ? 'badge-pending' :
                             (${order.status=='PAID'}    ? 'badge-paid'    :
                             (${order.status=='SHIPPED'} ? 'badge-shipped' : 'badge-completed'))"
              th:text="${order.status=='PENDING'} ? 'Chờ xử lý' :
                       (${order.status=='PAID'}    ? 'Đã thanh toán' :
                       (${order.status=='SHIPPED'} ? 'Đang giao' : 'Hoàn thành'))">
        </span>
        <span class="topbar-sep"></span>
        <span th:if="${order != null}" style="font-size:.78rem;color:var(--text-muted);"
              th:text="${#temporals.format(order.createdAt,'HH:mm · dd/MM/yyyy')}"></span>
    </div>

    <div class="content-area">

        <div th:if="${success}" class="alert alert-success" style="margin-bottom:14px;">
            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
        </div>

        <div th:if="${order == null}" class="admin-card">
            <div class="admin-card-body">
                <div class="empty-state"><i class="bi bi-inbox"></i><p>Không tìm thấy đơn hàng.</p></div>
            </div>
        </div>

        <div th:if="${order != null}">

            <!-- ── Status strip ── -->
            <div class="od-status-card">
                <div class="tl">

                    <!-- Đặt hàng -->
                    <div class="tl-step tl-done">
                        <div class="tl-dot done"><i class="bi bi-check" style="font-size:.6rem;"></i></div>
                        <div class="tl-lbl done">Đặt hàng</div>
                    </div>

                    <!-- Xác nhận -->
                    <div class="tl-step"
                         th:classappend="${order.status=='PENDING'} ? 'tl-active' :
                                        (${order.status!='PENDING'} ? 'tl-done' : '')">
                        <div class="tl-dot"
                             th:classappend="${order.status=='PENDING'} ? 'active' :
                                            (${order.status!='PENDING'} ? 'done' : '')">
                            <i class="bi bi-check" style="font-size:.6rem;" th:if="${order.status!='PENDING'}"></i>
                            <span th:unless="${order.status!='PENDING'}">2</span>
                        </div>
                        <div class="tl-lbl"
                             th:classappend="${order.status=='PENDING'} ? 'active' :
                                            (${order.status!='PENDING'} ? 'done' : '')">Xác nhận</div>
                    </div>

                    <!-- Đang giao -->
                    <div class="tl-step"
                         th:classappend="${order.status=='SHIPPED'} ? 'tl-active' :
                                        (${order.status=='PAID' or order.status=='COMPLETED'} ? 'tl-done' : '')">
                        <div class="tl-dot"
                             th:classappend="${order.status=='SHIPPED'} ? 'active' :
                                            (${order.status=='PAID' or order.status=='COMPLETED'} ? 'done' : '')">
                            <i class="bi bi-check" style="font-size:.6rem;"
                               th:if="${order.status=='PAID' or order.status=='COMPLETED'}"></i>
                            <i class="bi bi-truck" style="font-size:.55rem;" th:if="${order.status=='SHIPPED'}"></i>
                            <span th:unless="${order.status=='SHIPPED' or order.status=='PAID' or order.status=='COMPLETED'}">3</span>
                        </div>
                        <div class="tl-lbl"
                             th:classappend="${order.status=='SHIPPED'} ? 'active' :
                                            (${order.status=='PAID' or order.status=='COMPLETED'} ? 'done' : '')">Đang giao</div>
                    </div>

                    <!-- Đã thanh toán — COD only -->
                    <div class="tl-step" th:if="${order.paymentMethod=='cod'}"
                         th:classappend="${order.status=='PAID'} ? 'tl-active' :
                                        (${order.status=='COMPLETED'} ? 'tl-done' : '')">
                        <div class="tl-dot"
                             th:classappend="${order.status=='PAID'} ? 'paid' :
                                            (${order.status=='COMPLETED'} ? 'done' : '')">
                            <i class="bi bi-check" style="font-size:.6rem;" th:if="${order.status=='COMPLETED'}"></i>
                            <i class="bi bi-cash-coin" style="font-size:.55rem;" th:if="${order.status=='PAID'}"></i>
                            <span th:unless="${order.status=='PAID' or order.status=='COMPLETED'}">4</span>
                        </div>
                        <div class="tl-lbl"
                             th:classappend="${order.status=='PAID'} ? 'paid' :
                                            (${order.status=='COMPLETED'} ? 'done' : '')">Đã TT</div>
                    </div>

                    <!-- Hoàn thành -->
                    <div class="tl-step"
                         th:classappend="${order.status=='COMPLETED'} ? 'tl-done' : ''">
                        <div class="tl-dot" th:classappend="${order.status=='COMPLETED'} ? 'done' : ''">
                            <i class="bi bi-check" style="font-size:.6rem;" th:if="${order.status=='COMPLETED'}"></i>
                            <span th:unless="${order.status=='COMPLETED'}"
                                  th:text="${order.paymentMethod=='cod'} ? '5' : '4'">5</span>
                        </div>
                        <div class="tl-lbl" th:classappend="${order.status=='COMPLETED'} ? 'done' : ''">Hoàn thành</div>
                    </div>

                </div>

                <!-- Status changer -->
                <div class="od-status-right">
                    <form th:action="@{/admin/orders/update-status}" method="post"
                          style="display:flex;gap:6px;align-items:center;">
                        <input type="hidden" name="id" th:value="${order.id}">
                        <input type="hidden" name="from" value="detail">
                        <select name="status" class="status-sel">
                            <option value="PENDING"   th:selected="${order.status=='PENDING'}">Chờ xử lý</option>
                            <option value="PAID"      th:if="${order.paymentMethod=='cod'}"
                                                      th:selected="${order.status=='PAID'}">Đã thanh toán (COD)</option>
                            <option value="SHIPPED"   th:selected="${order.status=='SHIPPED'}">Đang giao</option>
                            <option value="COMPLETED" th:selected="${order.status=='COMPLETED'}">Hoàn thành</option>
                        </select>
                        <button type="submit" class="btn-nb2 btn-accent btn-sm">Cập nhật</button>
                    </form>
                </div>
            </div>

            <!-- ── Main grid ── -->
            <div class="od-grid">

                <!-- LEFT: items -->
                <div class="od-items-card">
                    <div class="od-items-head">
                        <h6><i class="bi bi-bag" style="color:var(--accent);margin-right:6px;"></i>Sản phẩm</h6>
                        <span style="font-size:.75rem;color:var(--text-muted);"
                              th:text="${#lists.size(order.items)} + ' món'"></span>
                    </div>
                    <table class="od-table">
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th>Size</th>
                                <th class="c">SL</th>
                                <th class="r">Đơn giá</th>
                                <th class="r">Thành tiền</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${order.items}">
                                <td style="font-weight:600;" th:text="${item.productName}"></td>
                                <td><span class="sz" th:text="${item.size}"></span></td>
                                <td class="c" th:text="${item.quantity}"></td>
                                <td class="r" style="color:var(--text-muted);"
                                    th:text="${#numbers.formatInteger(item.price,0,'COMMA').replace(',','.')}+'₫'"></td>
                                <td class="r" style="font-weight:700;"
                                    th:text="${#numbers.formatInteger(item.price*item.quantity,0,'COMMA').replace(',','.')}+'₫'"></td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="od-total">
                        <span class="od-total-lbl">Tổng cộng</span>
                        <span class="od-total-val" th:text="${order.formattedTotal}"></span>
                    </div>
                </div>

                <!-- RIGHT: sidebar -->
                <div class="od-side-card">

                    <!-- Customer -->
                    <div class="od-side-sec">
                        <div class="od-sec-title">Khách hàng</div>
                        <div class="od-cust-name" th:text="${order.customerName}"></div>
                        <div class="od-cust-row">
                            <i class="bi bi-telephone" style="color:var(--accent);"></i>
                            <a th:href="'tel:'+${order.customerPhone}" th:text="${order.customerPhone}"
                               style="color:var(--accent);text-decoration:none;font-weight:600;"></a>
                        </div>
                        <div class="od-cust-row">
                            <i class="bi bi-geo-alt"></i>
                            <span th:text="${order.customerAddress}"></span>
                        </div>
                    </div>

                    <!-- Order meta -->
                    <div class="od-side-sec">
                        <div class="od-sec-title">Thông tin đơn</div>
                        <div class="od-meta">
                            <span class="od-meta-k">Mã đơn</span>
                            <span class="od-meta-v" style="font-family:monospace;font-size:.75rem;"
                                  th:text="${order.id}"></span>
                            <span class="od-meta-k">Thời gian</span>
                            <span class="od-meta-v"
                                  th:text="${#temporals.format(order.createdAt,'HH:mm dd/MM/yy')}"></span>
                            <span class="od-meta-k">Thanh toán</span>
                            <span class="od-meta-v"
                                  th:text="${order.paymentMethod=='cod'}  ? 'COD' :
                                           (${order.paymentMethod=='momo'} ? 'MoMo' :
                                           (${order.paymentMethod=='bank'} ? 'Chuyển khoản' : 'Thẻ'))"></span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
