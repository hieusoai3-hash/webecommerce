<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng - NB2 Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<div th:replace="~{admin/layout :: sidebar}" th:with="activePage='orders'"></div>

<div class="admin-wrapper">
    <div class="topbar">
        <h1>Đơn hàng</h1>
    </div>

    <div class="content-area">
        <div th:if="${success}" class="alert alert-success">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">
                <h6><i class="bi bi-bag-check me-2" style="color:var(--accent)"></i>Danh sách đơn hàng</h6>
                <span style="font-size:.8rem; color:var(--text-muted);"
                      th:text="${#lists.size(orders)} + ' đơn'"></span>
            </div>
            <div class="admin-card-body no-pad">
                <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <p>Chưa có đơn hàng nào.</p>
                </div>
                <table th:if="${!#lists.isEmpty(orders)}" class="admin-table">
                    <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Sản phẩm</th>
                        <th>Tổng tiền</th>
                        <th>Thanh toán</th>
                        <th>Thời gian</th>
                        <th width="210">Trạng thái</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}" style="cursor:pointer;"
                        th:attr="onclick=|window.location.href='@{/admin/orders/detail(id=${order.id})}'|">
                        <td><strong th:text="${order.id}"></strong></td>
                        <td>
                            <div th:text="${order.customerName}"></div>
                            <div style="font-size:.78rem; color:var(--text-muted);"
                                 th:text="${order.customerPhone}"></div>
                        </td>
                        <td>
                            <div style="font-size:.8rem; color:var(--text-muted); line-height:1.6;">
                                <div th:each="item : ${order.items}">
                                    <span th:text="${item.productName}"></span>
                                    <span style="color:var(--text-soft);"
                                          th:text="' ×' + ${item.quantity} + ' (' + ${item.size} + ')'"></span>
                                </div>
                            </div>
                        </td>
                        <td style="font-weight:700;" th:text="${order.formattedTotal}"></td>
                        <td>
                            <span class="badge badge-gray"
                                  th:text="${order.paymentMethod == 'cod'} ? 'COD' :
                                           (${order.paymentMethod == 'momo'} ? 'MoMo' :
                                           (${order.paymentMethod == 'bank'} ? 'Chuyển khoản' : 'Thẻ'))">
                            </span>
                        </td>
                        <td style="font-size:.8rem; color:var(--text-muted);"
                            th:text="${#temporals.format(order.createdAt, 'dd/MM/yy HH:mm')}"></td>
                        <td>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="badge"
                                      th:classappend="${order.status == 'PENDING'} ? 'badge-pending' : (${order.status == 'PAID'} ? 'badge-paid' : (${order.status == 'SHIPPED'} ? 'badge-shipped' : 'badge-completed'))"
                                      th:text="${order.status == 'PENDING'} ? 'Chờ xử lý' : (${order.status == 'PAID'} ? 'Đã thanh toán' : (${order.status == 'SHIPPED'} ? 'Đang giao' : 'Hoàn thành'))">
                                </span>
                                <div class="dropdown" onclick="event.stopPropagation()">
                                    <button class="btn-nb2 btn-outline btn-sm dropdown-toggle">
                                        <i class="bi bi-chevron-down"></i>
                                    </button>
                                    <div class="dropdown-menu">
                                        <form th:action="@{/admin/orders/update-status}" method="post">
                                            <input type="hidden" name="id" th:value="${order.id}">
                                            <input type="hidden" name="status" value="PENDING">
                                            <button type="submit" class="dropdown-item">
                                                <i class="bi bi-clock" style="color:var(--warning);"></i> Chờ xử lý
                                            </button>
                                        </form>
                                        <form th:if="${order.paymentMethod == 'cod'}"
                                              th:action="@{/admin/orders/update-status}" method="post">
                                            <input type="hidden" name="id" th:value="${order.id}">
                                            <input type="hidden" name="status" value="PAID">
                                            <button type="submit" class="dropdown-item">
                                                <i class="bi bi-cash-coin" style="color:#7c3aed;"></i> Đã thanh toán (COD)
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/orders/update-status}" method="post">
                                            <input type="hidden" name="id" th:value="${order.id}">
                                            <input type="hidden" name="status" value="SHIPPED">
                                            <button type="submit" class="dropdown-item">
                                                <i class="bi bi-truck" style="color:var(--info);"></i> Đang giao
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/orders/update-status}" method="post">
                                            <input type="hidden" name="id" th:value="${order.id}">
                                            <input type="hidden" name="status" value="COMPLETED">
                                            <button type="submit" class="dropdown-item">
                                                <i class="bi bi-check-circle" style="color:var(--success);"></i> Hoàn thành
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let activeMenu = null;

function closeAll() {
    document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
    activeMenu = null;
}

document.querySelectorAll('.dropdown-toggle').forEach(btn => {
    btn.addEventListener('click', e => {
        e.stopPropagation();
        const menu = btn.closest('.dropdown').querySelector('.dropdown-menu');
        if (menu === activeMenu) { closeAll(); return; }
        closeAll();

        const rect = btn.getBoundingClientRect();
        menu.style.top  = (rect.bottom + 6) + 'px';
        menu.style.right = (window.innerWidth - rect.right) + 'px';
        menu.style.left = 'auto';
        menu.classList.add('open');
        activeMenu = menu;
    });
});

document.addEventListener('click', closeAll);
window.addEventListener('scroll', closeAll, true);
window.addEventListener('resize', closeAll);
</script>
</body>
</html>
