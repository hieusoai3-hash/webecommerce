<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Kết quả tìm kiếm: ' + ${query} + ' - NB2 Boxer Men'">Tìm kiếm - NB2 Boxer Men</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/header :: top}"></div>

<!-- Page Hero -->
<section class="page-hero">
    <div class="page-hero-content">
        <div class="container">
            <div class="breadcrumb">
                <a th:href="@{/}">Trang chủ</a> <span>&#8250;</span>
                <span style="color:#fff;">Tìm kiếm</span>
            </div>
            <h1>Kết Quả Tìm Kiếm</h1>
            <p th:text="'Từ khoá: &quot;' + ${query} + '&quot;'"></p>
        </div>
    </div>
</section>

<!-- Results Section -->
<section class="products" id="products" style="padding-top: 50px;">
    <div class="container">
        <div class="products-toolbar">
            <p class="products-count">
                Tìm thấy <strong th:text="${#lists.size(products)}"></strong>
                sản phẩm cho &ldquo;<span th:text="${query}"></span>&rdquo;
            </p>
        </div>

        <!-- No results -->
        <div th:if="${#lists.isEmpty(products)}" style="text-align:center; padding: 80px 0; color:#666;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" style="margin-bottom:16px">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <p style="font-size:1.1rem; margin-bottom:8px;">Không tìm thấy sản phẩm nào.</p>
            <p style="font-size:.9rem;">Thử lại với từ khoá khác hoặc <a th:href="@{/san-pham}" style="color:#1a1a2e; font-weight:600;">xem tất cả sản phẩm</a>.</p>
        </div>

        <!-- Results grid -->
        <div class="product-grid" th:if="${!#lists.isEmpty(products)}">
            <th:block th:each="product : ${products}">
                <div th:replace="~{fragments/product-card :: card(product=${product})}"></div>
            </th:block>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: bottom}"></div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
