spring.application.name=ecommerce
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# H2 Database (file-based, persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/ecommercedb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (accessible at /h2-console for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload (10 MB max)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin credentials (change before deploying to production)
admin.username=admin
admin.password=admin123
