spring.application.name=ecommerce
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:9000/ecommercedb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=ecommerce
# Set DB_PASSWORD env var in production — fallback is for local dev only
spring.datasource.password=${DB_PASSWORD:Cxautrai@123}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Migration script disabled — Hibernate DDL creates all columns on fresh DB
spring.sql.init.mode=never

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-part-count=-1
server.tomcat.max-parameter-count=-1

# Upload directory (override with UPLOAD_DIR env var in Docker)
upload.dir=${UPLOAD_DIR:src/main/resources/static}

# Flyway — baseline-on-migrate handles existing DBs that predate Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Admin credentials (change before deploying to production)
admin.username=admin
admin.password=admin123
