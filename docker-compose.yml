services:

  postgres:
    image: postgres:16
    container_name: nb2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: "Cxautrai123"
      POSTGRES_DB: ecommercedb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - nb2-pgdata:/var/lib/postgresql/data
      - ./src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "9000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommercedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: web-ban-xip
    restart: "no"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommercedb
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: "Cxautrai123"
      UPLOAD_DIR: /app/uploads
      ADMIN_PASSWORD: admin123
    volumes:
      - nb2-uploads:/app/uploads

volumes:
  nb2-pgdata:
  nb2-uploads:
