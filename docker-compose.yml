# Setup lần đầu (build image app + tạo container app, chưa chạy):
#   docker compose build app
#   docker compose create app
# Sau đó vào Docker Desktop → bấm Start web-ban-xip thủ công.
# (nb2-postgres tự chạy khi bật Docker Desktop vì restart: unless-stopped)

services:

  postgres:
    image: postgres:16
    container_name: nb2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: Cxautrai@123
      POSTGRES_DB: ecommercedb
    volumes:
      - nb2-pgdata:/var/lib/postgresql/data
    ports:
      - "9000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommercedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: web-ban-xip
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommercedb
      SPRING_DATASOURCE_USERNAME: ecommerce
      SPRING_DATASOURCE_PASSWORD: Cxautrai@123
      UPLOAD_DIR: /app/uploads
      # Set ADMIN_PASSWORD in your shell before running: export ADMIN_PASSWORD=your_secure_password
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - nb2-uploads:/app/uploads

volumes:
  nb2-pgdata:
  nb2-uploads:
